<svg viewBox="0 0 120 120" width="120" height="120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-card-bg" x1="16" y1="12" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#18181B" />
      <stop offset="100%" stopColor="#09090B" />
    </linearGradient>
    <linearGradient id="fav-shield-stroke" x1="28" y1="22" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fav-arch-stroke" x1="44" y1="52" x2="76" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#93C5FD" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#60A5FA" />
    </linearGradient>
    <linearGradient id="fav-beam-grad" x1="44" y1="69" x2="76" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.3" />
      <stop offset="50%" stopColor="#38BDF8" stopOpacity="1" />
      <stop offset="100%" stopColor="#38BDF8" stopOpacity="0.3" />
    </linearGradient>
  </defs>

  <!-- App Squircle Card -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#fav-card-bg)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <!-- Shield Crest -->
  <path d="M 60 21 C 76 21, 89 25, 90 46 C 91 69, 73 86, 60 93 C 47 86, 29 69, 30 46 C 31 25, 44 21, 60 21 Z" fill="#111827" stroke="url(#fav-shield-stroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High-Rise Towers -->
  <path d="M 40 45 L 49 41 L 49 73 L 40 73 Z" fill="#94A3B8" opacity="0.85" />
  <path d="M 71 41 L 80 45 L 80 73 L 71 73 Z" fill="#94A3B8" opacity="0.85" />
  <path d="M 60 27 L 69 33 L 69 73 L 51 73 L 51 33 Z" fill="#FFFFFF" />
  <line x1="60" y1="21" x2="60" y2="27" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />

  <!-- Grand Gate Arch ("Dwar") -->
  <path d="M 45 74 L 45 56 C 45 47, 75 47, 75 56 L 75 74" fill="none" stroke="url(#fav-arch-stroke)" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 49 74 L 49 58 C 49 51, 71 51, 71 58 L 71 74" fill="#090D18" stroke="#60A5FA" stroke-width="1.4" />

  <!-- Smart Access Beam -->
  <line x1="49" y1="67" x2="71" y2="67" stroke="url(#fav-beam-grad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="67" r="2.5" fill="#FFFFFF" />

  <!-- Cloud Beacon -->
  <circle cx="60" cy="19" r="2.5" fill="#60A5FA" />
</svg>